[package]
name = "concur-api"
version = "0.1.0"
edition = "2024"
authors = ["Balamurali Pandranki <balamurali@live.com>", "Kesk Open Source <opensource@kesk.app>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/wearekesk/concur-rs"
homepage = "https://github.com/wearekesk/concur-rs"
documentation = "https://docs.rs/concur-api"
keywords = ["sap", "concur", "api", "expense", "oauth2"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
description = "A Rust client for the SAP Concur REST APIs (v4 / v4.1)."

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "http2", "rustls", "multipart", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.12"
tokio = { version = "1.44.0", features = ["time"] }
chrono = { version = "0.4.40", features = ["serde"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
base64 = "0.22.1"
tracing = "0.1.41"
urlencoding = "2.1.3"
async-trait = "0.1.88"

[dev-dependencies]
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.3"

[lib]
name = "concur_api"
path = "src/lib.rs"
